<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1423" />
  <meta name="description" content="سامانه جامع دبیران پژوهشکده؛ مدیریت دبیرخانه‌ها، مأموریت‌ها، گزارش‌ها و ظرفیت پژوهشی" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="پژوهشکده" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <link rel="icon" href="./icons/icon-192.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <title>سامانه جامع دبیران | پژوهشکده</title>
  <style>
    :root { color-scheme: dark; --bg:#081320; --bg2:#0b1728; --panel:#121f30; --panel2:#16263a; --panel3:#1b2d43; --line:#293c50; --line2:#34495e; --text:#f0f5fc; --sub:#a8b9cc; --muted:#7790a8; --gold:#e9bd68; --cyan:#53c9ca; --green:#37c99c; --red:#f57883; --blue:#75a3ff; --purple:#b59bfa; --shadow:0 18px 55px #0002; --radius:17px; }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; background:radial-gradient(ellipse at 40% -25%,#1b3450 0,transparent 47%),var(--bg); color:var(--text); font-family:'Vazirmatn',Tahoma,sans-serif; line-height:1.75; min-height:100vh; font-size:13px; }
    button,input,textarea,select { font:inherit; }
    button { cursor:pointer; }
    button:disabled { cursor:not-allowed;opacity:.5; }
    a { color:var(--cyan);text-decoration:none; }
    input,textarea,select { outline:0; }
    ::placeholder { color:#70869d; }
    ::selection { background:#2d5e78; }
    .ico { width:19px;height:19px;display:inline-block;flex:none;vertical-align:middle;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round; }
    .ico.sm { width:16px;height:16px; }.ico.lg { width:23px;height:23px; }.ico.xl { width:31px;height:31px; }
    .app { min-height:100vh;display:flex; }
    .sidebar { width:254px;flex:0 0 254px;background:linear-gradient(180deg,#0c192a,#0a1625);border-left:1px solid #24384d;position:fixed;right:0;top:0;bottom:0;z-index:35;display:flex;flex-direction:column;padding:20px 13px 16px;overflow-y:auto;scrollbar-width:thin; }
    .brand { display:flex;align-items:center;gap:12px;padding:6px 12px 22px;border-bottom:1px solid #24364a; }
    .brandmark { display:grid;place-items:center;border-radius:13px;width:47px;height:47px; flex:none;background:linear-gradient(150deg,#f0d18a,#ad7d31);color:#132031;box-shadow:0 4px 24px #e3b75a33; }
    .brandmark svg { width:28px;height:28px; }
    .brandname {font-weight:900;font-size:17px;letter-spacing:-.5px;line-height:1.45;}
    .brandsub { font-size:10px;color:var(--muted);margin-top:2px; }
    .navlabel { color:#617d99;font-size:10px;font-weight:800;letter-spacing:.3px;padding:18px 14px 7px; }
    .nav { display:grid;gap:3px; }
    .navbtn { width:100%;border:1px solid transparent;color:#bfcee0;display:flex;align-items:center;gap:13px;padding:10px 13px;background:none;border-radius:10px;text-align:right;font-weight:600;transition:background .15s, color .15s; }
    .navbtn:hover { background:#1a2c41; color:#fff; }
    .navbtn.active { color:var(--gold);background:#1b2d42;border-color:#334458;position:relative; }
    .navbtn.active:before {content:"";width:3px;border-radius:8px;background:var(--gold);position:absolute;right:-13px;top:6px;bottom:6px;}
    .navbtn .count {margin-right:auto;color:#fff;background:#cc5664;border-radius:25px;padding:0 7px;font-size:10px;}
    .sidefooter { margin-top:auto;padding:16px 8px 4px; }
    .sidefooter .slogan {border-radius:15px;background:linear-gradient(145deg,#203047,#101b2b);min-height:116px;display:flex;align-items:center;justify-content:center;flex-direction:column;border:1px solid #30445a;color:var(--gold);font-weight:800;line-height:2.1;font-size:13px;text-align:center;}
    .sidefooter .slogan small {font-weight:400;color:var(--muted);font-size:9px;}
    .demo-strip { padding:8px 10px;border:1px dashed #53637c;border-radius:9px;margin-top:12px;color:#9fb0c4;font-size:10px;text-align:center; }
    .main { margin-right:254px;min-width:0;width:calc(100% - 254px); }
    .topbar { min-height:81px;border-bottom:1px solid #26394e;background:#0e1d2fd9;backdrop-filter:blur(15px);display:flex;align-items:center;gap:20px;padding:12px 29px;position:sticky;top:0;z-index:25; }
    .pageheading { flex:0 0 auto;min-width:200px; }
    .pageheading h1 { margin:0;font-size:21px;line-height:1.4;font-weight:900;letter-spacing:-.4px; }
    .pageheading p {margin:1px 0 0;color:#8299af;font-size:11px;}
    .searchwrap {max-width:500px;flex:1;display:flex;align-items:center;gap:10px;padding:0 13px;background:#14263a;border:1px solid #38526c;border-radius:12px;height:42px;color:#88a6be;}
    .searchwrap input {background:transparent;border:0;width:100%;color:var(--text);font-size:12px;}
    .topactions {margin-right:auto;display:flex;align-items:center;gap:11px;}
    .iconbtn { width:40px;height:40px;position:relative;display:grid;place-items:center;border:1px solid #34475c;color:#c8d6e8;background:#142438;border-radius:11px; }
    .iconbtn:hover {background:#213750;}
    .iconbtn .dot {position:absolute;top:2px;right:1px;background:#f16c76;border:2px solid #142438;color:white;font-size:9px;min-width:17px;height:17px;border-radius:30px;display:grid;place-items:center;line-height:1;}
    .userbtn { display:flex;align-items:center;gap:9px;min-width:176px;padding:5px 9px;border:1px solid #354b61;border-radius:12px;color:#fff;background:#15263a;text-align:right; }
    .avatar { display:grid;place-items:center;flex:none;width:36px;height:36px;border-radius:50%;background:linear-gradient(145deg,#376480,#20364f);color:#c7edff;font-size:12px;font-weight:800;border:1px solid #5b7992; }
    .avatar.gold {background:linear-gradient(140deg,#906b32,#42311e);color:#f7d28c;border-color:#c39a54;}
    .userbtn .usertext {display:grid;line-height:1.55;flex:1;min-width:0;}
    .userbtn small {font-size:10px;color:#a1b4c9;}
    .content { max-width:1750px;margin:auto;padding:25px 29px 65px; }
    .pageintro { display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:20px; }
    .pageintro h2 {margin:0;font-size:20px;font-weight:800;}
    .pageintro p { margin:3px 0 0;color:var(--muted);font-size:12px; }
    .toolbar {display:flex;align-items:center;flex-wrap:wrap;gap:9px;}
    .btn {display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid #3c5268;border-radius:10px;padding:9px 13px;color:#e5ecf5;background:#172b40;font-weight:700;font-size:11px;white-space:nowrap;transition:transform .12s,background .12s;}
    .btn:hover {background:#213a53;transform:translateY(-1px);}
    .btn.primary {background:linear-gradient(120deg,#dbb66f,#bf9140);border-color:#e4bd76;color:#182334;}
    .btn.primary:hover {background:#f1cd88;}
    .btn.danger {background:#562e39;color:#ffd5d5;border-color:#874351;}
    .btn.ghost {background:transparent;border-color:#32485d;}
    .btn.sm {padding:6px 9px;font-size:10px;border-radius:8px;}
    .btn.justicon {width:33px;height:33px;padding:0;}
    .statgrid {display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-bottom:16px;}
    .stat { padding:18px 19px;background:linear-gradient(132deg,#1b2b40,#121f30);border:1px solid #2d4357;border-radius:var(--radius);position:relative;overflow:hidden;min-height:134px;box-shadow:var(--shadow); }
    .stat:after {content:"";position:absolute;width:150px;height:150px;border-radius:50%;background:var(--tint,#ffffff07);filter:blur(35px);left:-45px;bottom:-100px;pointer-events:none;}
    .statrow {display:flex;align-items:start;justify-content:space-between;gap:7px;}
    .stat .label {font-size:13px;font-weight:700;color:#dbe4ee;}
    .stat .value {font-size:29px;font-weight:900;line-height:1.4;margin:2px 0;}
    .stat small {color:#9aafc3;font-size:10px;}
    .staticon {width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--shade,#1b5349);color:var(--tone,#42e3b9);}
    .mini-track {height:5px;border-radius:30px;background:#2b3c4f;overflow:hidden;margin-top:14px;}
    .mini-track div {height:100%;border-radius:30px;background:var(--tone,#40c99f);max-width:100%;}
    .dashboard-grid {display:grid;grid-template-columns:1.45fr 1fr;gap:15px;align-items:stretch;}
    .panel {background:linear-gradient(155deg,#142339,#111e2e);border:1px solid #2a4156;border-radius:var(--radius);box-shadow:var(--shadow);min-width:0;overflow:hidden;}
    .panelhead {display:flex;align-items:center;justify-content:space-between;gap:9px;padding:16px 17px 12px;}
    .panelhead h3 {margin:0;font-size:14px;font-weight:800;}
    .panelbody {padding:0 16px 16px;}
    .datatable {width:100%;border-collapse:collapse;white-space:nowrap;font-size:11px;}
    .datatable th {background:#182b40;color:#9bb1c6;font-weight:600;padding:10px 9px;text-align:right;border-top:1px solid #30465a;border-bottom:1px solid #30465a;}
    .datatable td {padding:11px 9px;border-bottom:1px solid #293e51;color:#dbe5f0;}
    .datatable tbody tr {transition:background .15s;}
    .datatable tbody tr:hover {background:#21374c;}
    .datatable tbody tr:last-child td {border-bottom:0;}
    .datatable td.first {font-weight:700;max-width:260px;overflow:hidden;text-overflow:ellipsis;}
    .tablewrap {overflow:auto;scrollbar-width:thin;}
    .pill {font-size:10px;font-weight:700;padding:4px 9px;display:inline-flex;align-items:center;gap:5px;border-radius:20px;white-space:nowrap;}
    .pill:before {content:"";width:6px;height:6px;border-radius:50%;background:currentColor;}
    .pill.green {background:#0b493e;color:#5be0b5;}.pill.blue {background:#1e416f;color:#88baff;}.pill.red {background:#5a2a36;color:#ff8796;}.pill.yellow {background:#4f4126;color:#f0c46b;}.pill.purple {background:#39365d;color:#c4b3ff;}
    .clickable {cursor:pointer;}
    .muted {color:var(--muted);}.light {color:#b4c4d6;}.tiny {font-size:10px;}.small {font-size:11px;}.bold {font-weight:800;}
    .section-grid {display:grid;grid-template-columns:1fr 1fr 1fr;gap:15px;margin-top:15px;}
    .depttile-grid {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;}
    .depttile {padding:12px;background:#1b2e43;border:1px solid #2d4359;border-radius:11px;text-align:right;display:block;color:inherit;}
    .depttile:hover {background:#233c55;}
    .depttile-head {display:flex;align-items:center;gap:9px;margin-bottom:11px;}
    .depttile b {font-size:12px;}.depttile small {color:#829ab2;font-size:10px;}
    .deptico {width:35px;height:35px;display:grid;place-items:center;border-radius:9px;background:#173d49;color:#61dfdd;}
    .meter {height:6px;background:#33485b;border-radius:20px;overflow:hidden;flex:1;}
    .meter > i {height:100%;display:block;border-radius:20px;background:var(--green);}
    .deptbottom {display:flex;align-items:center;gap:8px;}
    .deptbottom span {font-size:10px;color:#dbe8f2;}
    .chart {min-height:240px;padding:10px 14px 14px;}
    .chart-plot {height:206px;border-bottom:1px solid #476077;position:relative;display:flex;align-items:stretch;justify-content:space-around;gap:6px;padding:15px 0 0;background:repeating-linear-gradient(to top,transparent 0,transparent calc(25% - 1px),#2a4054 calc(25% - 1px),#2a4054 25%);}
    .barset {align-self:stretch;display:flex;align-items:end;justify-content:center;gap:5px;flex:1;position:relative;padding-bottom:0;}
    .bar {width:22px;max-width:35%;border-radius:4px 4px 0 0;min-height:2px;background:linear-gradient(#5ea5ff,#3676da);}
    .bar.done {background:linear-gradient(#48e0b7,#25a37e);}
    .bar-labels {display:flex;justify-content:space-around;gap:5px;margin-top:8px;}
    .bar-labels span {text-align:center;color:#a9bacc;font-size:10px;flex:1;overflow:hidden;text-overflow:ellipsis;}
    .legend {display:flex;gap:15px;color:#abc1d5;font-size:10px;margin:0 15px 5px;}
    .legend b {display:inline-block;width:9px;height:9px;border-radius:2px;background:#509aff;margin-left:5px;}.legend .gr b {background:#38cba2;}
    .activity {display:grid;gap:0;}
    .activity-item {display:flex;align-items:start;gap:10px;border-bottom:1px solid #2c4054;padding:10px 0;}
    .activity-item:last-child {border-bottom:0;}
    .activity-item .roundico {width:34px;height:34px;border-radius:50%;background:#29384f;display:grid;place-items:center;flex:none;color:var(--gold);}
    .activity-item .roundico.alert {background:#532c3c;color:#ff8692;}
    .activity-item p {margin:0;font-size:11px;font-weight:700;line-height:1.7;}
    .activity-item small {color:#819ab3;font-size:10px;}
    .activity-item time {color:#8ea5b9;font-size:9px;margin-right:auto;white-space:nowrap;}
    .calendar-layout {display:grid;grid-template-columns:1.05fr .9fr;gap:12px;}
    .calhead {display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
    .weekgrid {display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;}
    .weekday,.calday {display:grid;place-items:center;font-size:10px;min-height:31px;position:relative;}
    .weekday {color:#819db6;}
    .calday {border-radius:7px;color:#c7d6e3;background:transparent;border:1px solid transparent;cursor:pointer;}
    .calday.active {background:#d8b46c;color:#172435;font-weight:900;}
    .calday.hasdot:after {content:"";position:absolute;width:4px;height:4px;border-radius:50%;background:var(--cyan);bottom:1px;}
    .calday.empty {pointer-events:none;}
    .upcoming {display:grid;align-content:start;gap:9px;}
    .upcoming-item {display:flex;align-items:center;gap:7px;border-bottom:1px solid #2c4153;padding-bottom:8px;}
    .upcoming-item:last-child {border:0;}
    .datechip {border:1px solid #39566f;padding:3px 5px;border-radius:7px;color:var(--gold);white-space:nowrap;font-size:10px;}
    .upcoming-item b {display:block;font-size:10px;}.upcoming-item small {font-size:9px;color:#8099ae;}
    .filterbar {display:flex;gap:9px;margin-bottom:16px;flex-wrap:wrap;align-items:center;}
    .filterbar select,.field select,.field input,.field textarea {background:#132438;border:1px solid #395168;color:#ebf1f8;border-radius:9px;padding:10px 11px;min-height:39px;width:100%;}
    .filterbar select {width:auto;min-width:155px;}
    .tabrow {display:flex;gap:5px;flex-wrap:wrap;}.tab {border:1px solid #33465b;background:#14263b;color:#a7bbd0;padding:6px 13px;border-radius:9px;font-size:11px;}.tab.active {color:var(--gold);border-color:#786344;background:#332e2d;}
    .fullpanel {margin-bottom:15px;}
    .deptcards {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;}
    .deptcard {padding:18px;cursor:pointer;transition:transform .15s,border-color .15s;}.deptcard:hover {transform:translateY(-2px);border-color:#5c7591;}
    .deptcard .head {display:flex;align-items:center;justify-content:space-between;gap:8px;}
    .deptcard h3 {margin:11px 0 4px;font-size:15px;}
    .deptcard .data {display:flex;justify-content:space-between;border-top:1px solid #31465a;margin-top:14px;padding-top:12px;font-size:11px;color:#a9bcd0;}
    .detailgrid {display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin-bottom:15px;}
    .detailgrid .mini {background:#17293c;border:1px solid #34475d;padding:17px;border-radius:13px;}.detailgrid .mini b {display:block;font-size:24px;}
    .taskgrid {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;}
    .taskcard {padding:18px;display:flex;flex-direction:column;gap:10px;}
    .taskcard h3 {margin:0;font-size:14px;line-height:1.7;}
    .taskcard p {margin:0;color:#a6b8ca;font-size:11px;}
    .taskmeta {display:flex;flex-wrap:wrap;gap:8px;color:#93aac1;font-size:10px;}
    .taskmeta span {display:inline-flex;align-items:center;gap:5px;}
    .taskfoot {display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:auto;}
    .staffgrid {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px;}
    .staffcard {padding:17px;}.staffcard .person {display:flex;align-items:center;gap:10px;margin-bottom:12px;}.staffcard small {color:#8fa7bc;}
    .daymini {display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:11px;}.daymini div {border-radius:6px;background:#293e54;text-align:center;padding:5px 2px;font-size:9px;color:#9bb4cb;}.daymini div.on {background:#214e54;color:#67dfc9;}
    .capacity-table {width:100%;border-collapse:collapse;min-width:700px;}.capacity-table th,.capacity-table td {border-bottom:1px solid #30465b;padding:12px 9px;text-align:center;}.capacity-table th {color:#91a9c1;font-size:11px;}.capacity-table td:first-child,.capacity-table th:first-child {text-align:right;}.capacity-table .total {color:var(--gold);font-weight:900;}
    .report-list {display:grid;gap:10px;}.report {padding:15px;background:#182a3d;border:1px solid #32495c;border-radius:12px;}.report .rh {display:flex;justify-content:space-between;gap:8px;align-items:center;}.report p {margin:8px 0;color:#b4c6d8;white-space:pre-wrap;}.report .rf {display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
    .empty {padding:40px 16px;text-align:center;color:#90a8be;}.empty .ico {color:#69869f;width:35px;height:35px;}.empty h3 {margin:10px 0 3px;color:#d4e0eb;font-size:14px;}
    .modalshade {position:fixed;inset:0;background:#020814d9;backdrop-filter:blur(5px);z-index:85;display:grid;place-items:center;padding:15px;overflow:auto;}
    .modal {background:#122237;border:1px solid #426078;border-radius:18px;width:min(100%,590px);max-height:calc(100vh - 30px);overflow:auto;box-shadow:0 35px 100px #0009;}
    .modalhead {display:flex;align-items:center;justify-content:space-between;padding:17px 21px;border-bottom:1px solid #344b60;}.modalhead h3 {margin:0;font-size:17px;}
    .modalbody {padding:20px;}.modalfooter {border-top:1px solid #344b60;padding:14px 20px;display:flex;justify-content:flex-end;gap:10px;}
    .field {display:grid;gap:6px;margin-bottom:14px;}.field label {font-weight:700;font-size:11px;color:#c5d7e8;}.field textarea {min-height:90px;resize:vertical;}
    .fields {display:grid;grid-template-columns:1fr 1fr;gap:0 13px;}.hint {font-size:10px;color:#879fb5;}.field input:focus,.field select:focus,.field textarea:focus {border-color:#d3aa63;box-shadow:0 0 0 2px #d9b56812;}
    .form-error {color:#ff909c;font-size:11px;margin:0 0 10px;min-height:0;}
    .drawer-scrim {display:none;}.mobilebar {display:none;}.menutoggle {display:none;}
    .notification-pop {position:fixed;left:25px;top:74px;z-index:50;width:360px;max-width:calc(100vw - 30px);background:#15263a;border:1px solid #476078;border-radius:15px;box-shadow:0 22px 80px #0009;padding:12px;max-height:70vh;overflow:auto;}
    .notice {display:flex;gap:10px;padding:11px 10px;border-bottom:1px solid #2c4053;cursor:pointer;}.notice:last-child {border:0;}.notice.unread {background:#1d3549;border-radius:9px;}.notice strong {font-size:11px;display:block;}.notice p {margin:1px 0;color:#a6bad0;font-size:10px;}.notice small {color:#8199b0;font-size:9px;}
    .toast {position:fixed;bottom:24px;left:25px;z-index:110;background:#1c3649;border:1px solid #578778;color:#e5fff2;border-radius:10px;box-shadow:0 15px 60px #000a;padding:12px 17px;display:flex;gap:9px;align-items:center;font-size:12px;max-width:calc(100% - 30px);}
    .identity {min-height:100vh;display:flex;align-items:center;justify-content:center;padding:25px;background:radial-gradient(circle at top,#213a55,#091421 55%);}
    .identitybox {width:min(900px,100%);padding:27px;background:#111f31;border:1px solid #344c64;border-radius:23px;box-shadow:0 28px 90px #0007;}
    .identitybox header {text-align:center;margin-bottom:20px;}.identitybox h1 {font-size:25px;margin:10px 0 4px;}.identitybox p {color:#9fb3c8;margin:0;font-size:12px;}
    .identitygrid {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;}
    .identityitem {padding:17px;background:#172a3e;color:#e2e9f4;border:1px solid #38526a;border-radius:13px;text-align:right;transition:background .15s,transform .15s;}.identityitem:hover {background:#213b54;transform:translateY(-2px);}.identityitem b {display:block;font-size:13px;margin-top:9px;}.identityitem small {color:#a3bad0;font-size:10px;display:block;line-height:1.8;}

    }
    if(type==='create-report'){
      let p=data.projects.find(p=>p.id===f.project);if(!p||!canReport(p))return formError('دسترسی ثبت گزارش برای این پروژه وجود ندارد.');let content=f.text.trim();if(content.length<6)return formError('گزارش را با حداقل چند کلمه توضیح ثبت کنید.');let link=f.telegram.trim();if(link&&!allowedUrl(link))return formError('لینک تلگرام باید HTTPS و مربوط به t.me یا telegram.me باشد.');data.reports.unshift({id:'r'+rid(),projectId:p.id,author:me().id,text:content,telegram:link,time:nowISO(),status:'در انتظار بررسی'});if(link)p.telegram=link;if(p.status!=='تکمیل شده')p.status='در انتظار بررسی';addNotice('گزارش جدید ثبت شد',`${person(me().id)?.name} برای «${p.title}» گزارش ثبت کرد.`,p.dept,'all');save();closeModal();go('reports');notify('گزارش ثبت و برای بررسی ارسال شد.');return;
    }
    if(type==='save-cap'){
      let u=person(ui.modal?.id);if(!u||(!isManager()&&u.id!==me().id))return formError('اجازه ویرایش ندارید.');let days=[];for(let i=0;i<7;i++){let x=Number(f[`day${i}`]);if(!Number.isFinite(x)||x<0||x>24)return formError('ظرفیت هر روز باید عددی بین صفر و ۲۴ ساعت باشد.');days.push(x);}u.days=days;save();closeModal();render();notify('برنامه هفتگی ذخیره شد.');return;
    }
    if(type==='create-dept'){
      if(!isManager())return formError('دسترسی ندارید.');let name=f.name.trim();if(name.length<2)return formError('نام دبیرخانه کوتاه است.');if(data.depts.some(x=>x.name===name))return formError('این دبیرخانه از قبل وجود دارد.');let id='d'+rid();data.depts.push({id,name,description:f.description.trim()||'دبیرخانه جدید پژوهشکده',icon:'folder'});save();closeModal();go('departments');notify('دبیرخانه ایجاد شد.');return;
    }
    if(type==='create-user'){
      if(!isManager())return formError('دسترسی ندارید.');let name=f.name.trim();if(name.length<2)return formError('نام معتبر وارد کنید.');if(!department(f.dept)||!['member','secretary','deputy'].includes(f.role))return formError('سمت یا دبیرخانه معتبر نیست.');data.users.push({id:'u'+rid(),name,role:f.role,dept:f.dept,days:[0,0,0,0,0,0,0]});save();closeModal();go('members');notify('عضو جدید افزوده شد.');return;
    }
  }
  let installPrompt=null;
  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;});
  window.addEventListener('appinstalled',()=>notify('سامانه روی دستگاه نصب شد.'));
  async function install(){if(installPrompt){installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;}else setModal('install-info');}
  async function enableNotifications(){if(!('Notification' in window)){notify('اعلان مرورگر در این دستگاه پشتیبانی نمی‌شود.');return;}try{let v=await Notification.requestPermission();notify(v==='granted'?'مجوز اعلان این مرورگر صادر شد.':'اعلان مرورگر فعال نشد.');if(v==='granted')new Notification('سامانه جامع دبیران',{body:'این یک اعلان آزمایشی در همین دستگاه است.',icon:'./icons/icon-192.png'});}catch(e){notify('درخواست اعلان در این مرورگر ممکن نیست.');}}
  function exportData(){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='dabiran-backup-'+addDays(0)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),500);notify('فایل پشتیبان ایجاد شد.');}
  function handleAction(action,el,e){
    const id=el.dataset.id;
    if(action==='switch-user'){if(!person(id))return;ui.selectedUser=id;localStorage.setItem('dabiran_demo_user',id);ui.page='dashboard';ui.dept=null;ui.modal=null;ui.mobileOpen=false;render();notify(`پنل ${person(id).name} فعال شد (حساب نمایشی).`);return;}
    if(action==='nav'){go(el.dataset.page);return;}
    if(action==='toggle-menu'){ui.mobileOpen=!ui.mobileOpen;render();return;}
    if(action==='toggle-notifs'){ui.notifOpen=!ui.notifOpen;render();return;}
    if(action==='role-picker'){setModal('role-picker');return;}
    if(action==='open-dept'){if(canSeeDept(id))go('dept',id);return;}
    if(action==='open-project'){setModal('project',id);return;}
    if(action==='new-project'){if(isManager())setModal('new-project');return;}
    if(action==='new-dept'){if(isManager())setModal('new-dept');return;}
    if(action==='new-user'){if(isManager())setModal('new-user');return;}
    if(action==='new-report'){setModal('new-report',id);return;}
    if(action==='edit-cap'){setModal('edit-cap',id);return;}
    if(action==='filter-status'){ui.filter=id;render();return;}
    if(action==='cal-next'){ui.monthOffset++;ui.selectedDay=null;render();return;}
    if(action==='cal-prev'){ui.monthOffset--;ui.selectedDay=null;render();return;}
    if(action==='select-day'){ui.selectedDay=id;render();return;}
    if(action==='close-modal'){closeModal();return;}
    if(action==='close-modal-backdrop'){if(e.target===el)closeModal();return;}
    if(action==='read-notice'){let x=data.notices.find(v=>v.id===id);if(x&&!x.readBy.includes(me().id))x.readBy.push(me().id);save();render();return;}
    if(action==='read-all'){allNotices().forEach(x=>{if(!x.readBy.includes(me().id))x.readBy.push(me().id);});save();render();notify('تمام اعلان‌ها خوانده‌شده علامت‌گذاری شدند.');return;}
    if(action==='ack-task'){let p=data.projects.find(x=>x.id===id);if(!p||p.assignee!==me()?.id)return;if(!p.acknowledgedAt){p.acknowledgedAt=nowISO();addNotice('تأیید دریافت ابلاغ',`${me().name} ابلاغ «${p.title}» را تأیید کرد.`,p.dept,'managers');save();}closeModal();render();notify('دریافت مأموریت ثبت شد.');return;}
    if(action==='review-report'){if(!isManager())return;let r=data.reports.find(v=>v.id===id);if(!r||r.status!=='در انتظار بررسی')return;r.status=el.dataset.value;let p=data.projects.find(p=>p.id===r.projectId);if(r.status==='تأیید شده'&&p){p.status='تکمیل شده';p.progress=100;}if(r.status==='نیازمند اصلاح'&&p){p.status='در حال اجرا';}addNotice('نتیجه بازبینی گزارش',`گزارش «${p?.title||'پروژه'}»: ${r.status}`,p?.dept||null,'all');save();render();notify('نتیجه بررسی ثبت شد.');return;}
    if(action==='install'){install();return;}
    if(action==='enable-notifs'){enableNotifications();return;}
    if(action==='export'){exportData();return;}
    if(action==='reset'){if(confirm('آیا از حذف تمام تغییرات همین مرورگر و بازگشت به داده‌های اولیه مطمئن هستید؟')){data=initialData();save();ui.page='dashboard';render();notify('داده‌های نمونه بازنشانی شدند.');}return;}
  }
  document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(el&&!(el.dataset.action==='close-modal-backdrop'&&e.target!==el)){if(el.tagName!=='A')e.preventDefault();handleAction(el.dataset.action,el,e);}else if(ui.notifOpen&&!e.target.closest('.notification-pop')){ui.notifOpen=false;render();}});
  document.addEventListener('submit',e=>{if(e.target.id==='modalForm'){e.preventDefault();handleSubmit(e.target);}});
  document.addEventListener('change',async e=>{
    if(e.target.id==='deptFilter'){ui.deptFilter=e.target.value;render();}
    if(e.target.id==='importFile'&&e.target.files?.[0]){if(!isManager())return;try{let txt=await e.target.files[0].text();let v=JSON.parse(txt);if(!v||!Array.isArray(v.depts)||!Array.isArray(v.users)||!Array.isArray(v.projects)||!Array.isArray(v.notices)||!Array.isArray(v.reports))throw Error('invalid');if(!confirm('داده‌های فعلی مرورگر با این نسخه پشتیبان جایگزین شوند؟'))return;data=v;save();ui.page='dashboard';render();notify('نسخه پشتیبان بازیابی شد.');}catch(e){notify('فایل پشتیبان معتبر نیست.');}}
  });
  document.addEventListener('input',e=>{
    if(e.target.id==='globalSearch'){ui.q=e.target.value; if(ui.q&&ui.page!=='projects')ui.page='projects';let pos=e.target.selectionStart;render();let input=$('#globalSearch');if(input){input.focus();input.setSelectionRange(pos,pos);}}
    if(e.target.name==='dept'&&ui.modal?.type==='new-project'){let s=$('#field_assignee'),choices=visibleUsers().filter(u=>u.dept===e.target.value);if(s)s.innerHTML=choices.map(u=>option(u.id,u.name)).join('');}
  });
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(ui.modal)closeModal();else if(ui.notifOpen){ui.notifOpen=false;render();}else if(ui.mobileOpen){ui.mobileOpen=false;render();}}});
  if('serviceWorker' in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
  render();
  </script>
</body>
</html>
